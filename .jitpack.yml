jdk:
    - openjdk21

# www.cct.lsu.edu, which hosts the flour interpreter used by the codegen tasks, has a certificate chaining to the
# emSign ECC Root CA - G3, which is in the Mozilla root store but not in the truststore of JitPack's OpenJDK build.
# certs/emsign-ecc-root-ca-g3.pem is that root, taken from the Mozilla store (SHA-256 fingerprint
# 86:A1:EC:BA:08:9C:4A:8D:3B:BE:27:34:C6:12:BA:34:1D:81:3E:04:3C:F9:E8:A8:62:CD:5C:57:A3:6B:BE:6B).
before_install:
    - keytool -importcert -noprompt -cacerts -storepass changeit -alias emsign-ecc-root-ca-g3 -file certs/emsign-ecc-root-ca-g3.pem
