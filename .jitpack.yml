jdk:
    - openjdk21

# www.cct.lsu.edu, which hosts the flour interpreter used by the codegen tasks, has a certificate chaining to an emSign
# root which is in the Mozilla root store but not in the truststore of JitPack's OpenJDK build. It chained to the emSign
# ECC Root CA - G3 until October 2026, and since to the RSA emSign Root CA - G1 (through InCommon Intermediate CA -
# OVG2C and emSign Root TLS CA - G1); both are trusted. Both roots are taken from the Mozilla store:
# certs/emsign-ecc-root-ca-g3.pem (SHA-256 fingerprint
# 86:A1:EC:BA:08:9C:4A:8D:3B:BE:27:34:C6:12:BA:34:1D:81:3E:04:3C:F9:E8:A8:62:CD:5C:57:A3:6B:BE:6B) and
# certs/emsign-root-ca-g1.pem (SHA-256 fingerprint
# 40:F6:AF:03:46:A9:9A:A1:CD:1D:55:5A:4E:9C:CE:62:C7:F9:63:46:03:EE:40:66:15:83:3D:C8:C8:D0:03:67).
before_install:
    - keytool -importcert -noprompt -cacerts -storepass changeit -alias emsign-ecc-root-ca-g3 -file certs/emsign-ecc-root-ca-g3.pem
    - keytool -importcert -noprompt -cacerts -storepass changeit -alias emsign-root-ca-g1 -file certs/emsign-root-ca-g1.pem
